name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to release (without v)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - name: Validate version and exact main revision
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_VERSION -ne $version -or $version -ne $tauriVersion -or $version -ne $cargoVersion) { throw 'Release version must match all package manifests.' }
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE -ne 0 -or $mainSha -ne $env:GITHUB_SHA) { throw 'main changed; rerun checks on its current revision.' }
      - name: Build installer and corresponding source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports,artifacts -Force | Out-Null
          npm run desktop:build 2>&1 | Tee-Object reports/release-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git archive --format=zip --output=artifacts/game-tracker-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          if ($LASTEXITCODE -ne 0 -or $mainSha -ne $env:GITHUB_SHA) { throw 'main changed during build; publication blocked.' }
          $files = Get-ChildItem artifacts -File | Select-Object -ExpandProperty FullName
          gh release create "v$env:RELEASE_VERSION" @files --target $env:GITHUB_SHA --title "Game Tracker v$env:RELEASE_VERSION" --generate-notes
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-diagnostics
          path: reports/
          retention-days: 14
