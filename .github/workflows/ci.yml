name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check interface, formatting and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          npm run check 2>&1 | Tee-Object reports/typescript.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run format:check 2>&1 | Tee-Object reports/format.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ui 2>&1 | Tee-Object reports/frontend.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:site 2>&1 | Tee-Object reports/website.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build 2>&1 | Tee-Object reports/frontend-build.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: frontend-reports
          path: reports/
          retention-days: 14
  backend:
    name: Backend
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: npm ci
      - run: npm run build
      - name: Check Rust formatting, lint and persistence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check 2>&1 | Tee-Object reports/rust-format.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | Tee-Object reports/clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:backend 2>&1 | Tee-Object reports/backend.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: backend-reports
          path: reports/
          retention-days: 14
  application:
    name: Application
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - name: Install native test drivers
        shell: pwsh
        run: |
          cargo install tauri-driver --locked --root .tools/tauri-driver
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/install-webdriver.ps1
          choco install gsudo --version=2.6.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\tools\gsudo\Current\gsudo.exe' --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test native application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path reports -Force | Out-Null
          npm run desktop:build -- --debug --no-bundle --config src-tauri/tauri.e2e.conf.json 2>&1 | Tee-Object reports/desktop-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Recent WebView2 ignores driver arguments in elevated hosts.
          # Run the native application at the same integrity level as a normal user.
          icacls "$env:GITHUB_WORKSPACE" /grant 'Everyone:(OI)(CI)F'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\tools\gsudo\Current\gsudo.exe' --integrity Medium cmd /c "npm run test:desktop" 2>&1 | Tee-Object reports/desktop.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: application-reports
          path: reports/
          retention-days: 14
  required:
    name: Required checks
    if: always()
    needs: [frontend, backend, application]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless all checks succeeded
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          APPLICATION: ${{ needs.application.result }}
        run: test "$FRONTEND" = success && test "$BACKEND" = success && test "$APPLICATION" = success
